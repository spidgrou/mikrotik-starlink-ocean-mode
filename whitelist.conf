# =============================================================================
# mikrotik-starlink-ocean-mode — whitelist.conf
#
# Domains allowed in Ocean Mode.
# The MikroTik resolves each FQDN into IPs and puts them in the
# "ocean-whitelist" address-list. Only traffic to these IPs (plus DNS) is
# allowed toward the WAN while Ocean Mode is active.
#
# HOW TO ADD A DOMAIN:
#   1. Edit this file (add the domain under the right section).
#   2. Apply it on the router:
#        /ip firewall address-list add list=ocean-whitelist address=example.com
#   3. The router resolves it on the next query / DNS refresh.
#
# For a full re-install from this list, run install.rsc.
# =============================================================================

# --- WhatsApp ---
whatsapp.com
whatsapp.net
web.whatsapp.com
mmg.whatsapp.net
media-l3-1.cdn.whatsapp.net

# --- Windy ---
windy.com
tile.windy.com
api.windy.com
cdn.windy.com

# --- PredictWind ---
predictwind.com
api.predictwind.com
cdn.predictwind.com

# --- Gmail (Google) ---
# NOTE: RouterOS address-list cannot resolve wildcard domains (*.google.com).
# We whitelist the base domains, which resolve to the Google IP ranges used
# by Gmail. Google shares many domains, so "only Gmail" is not perfectly
# isolatable — this opens most of google.com.
gmail.com
mail.google.com
accounts.google.com
apis.google.com
ssl.gstatic.com
www.gstatic.com
clients.google.com
contacts.google.com
mail-attachment.google.com
ogs.google.com
googleusercontent.com
google.com

# --- Outlook / Hotmail (Microsoft 365) ---
# NOTE: base domains only (no wildcards — RouterOS limit). Whitelisting
# Microsoft covers outlook.com and hotmail.com. CDN hosts
# (akamaized/edgekey/edgesuite) are NOT listed because wildcards can't be
# resolved; add specific hosts if media fails.
outlook.com
hotmail.com
outlook.office365.com
outlook.office.com
login.microsoftonline.com
login.live.com
mail.protection.outlook.com
office365.com
microsoftonline.com
live.com
microsoft.com
msocdn.com

# --- Telegram ---
# Bot API (whatsapp-style: the only FQDN the bot itself needs).
# The mobile/desktop clients connect to the Telegram datacenters by RAW IP,
# not by name, so the DC CIDR ranges are added to the address-list directly
# from install.rsc (block "Telegram DC ranges") -- they cannot live here.
api.telegram.org
telegram.org
t.me

# --- SignalK & on-board services ---
# PostgSail (voyage logging + monitoring)
api.openplotter.cloud
iot.openplotter.cloud
# NoForeignLand (boat tracking)
www.noforeignland.com
# AIS Stream (community AIS over websocket)
stream.aisstream.io
# aisreporter -> MarineTraffic only (vesselfinder/aishub deliberately excluded)
listener.marinetraffic.com
# Outbound email from SignalK / Node-RED notifications
mail.smtp2go.com

# --- AI assistant (Hermes on the boat server) ---
ollama.com

# --- X (Twitter) ---
x.com
twitter.com
api.twitter.com
t.co
twttr.com
twimg.com
